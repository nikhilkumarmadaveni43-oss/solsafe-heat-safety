# ==============================================================================
# SolSafe — Heat-Safe Delivery Routing & Rider Biometric Digital Twin Engine
# Java 21 / Spring Boot 3.3 Application Configuration
# ==============================================================================
spring.application.name=solsafe-heatsafety-backend
server.port=8050
server.servlet.context-path=/

# Serve static frontend dashboard directly from root and /frontend
spring.web.resources.static-locations=file:./frontend/,classpath:/static/

# Jackson JSON serialization settings
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SolSafe Microclimate & Physiological Threshold Constants
solsafe.wbgt.safe-threshold=27.5
solsafe.wbgt.caution-threshold=30.5
solsafe.wbgt.danger-threshold=32.5
solsafe.psi.mandatory-break-threshold=7.0
solsafe.default-city=hyderabad
